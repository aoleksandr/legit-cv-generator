# Full stack:        docker compose up --build
# Local development: docker compose up -d postgres   (or `pnpm db:up`), then `pnpm dev`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://cv:cv@postgres:5432/cv
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Required: the API refuses to start without a real secret (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      AI_MODEL_MAIN: ${AI_MODEL_MAIN:-claude-sonnet-5}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    # A crash or restart loses no work: jobs live in Postgres and resume (see README).
    restart: unless-stopped
    # Only reachable through the web container's /api proxy.
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
